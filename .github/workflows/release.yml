name: Release Build

# Push a tag like v1.2.0 to build every package and create a DRAFT GitHub Release (file host).
# "Run workflow" (manual) builds the packages as downloadable artifacts only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build macOS app
        run: |
          chmod +x macos/build.sh
          ./macos/build.sh
          cd macos
          ditto -c -k --keepParent --norsrc --noextattr "AI Gauge.app" ../AI-Gauge-macOS-vh2c.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: AI-Gauge-macOS-vh2c.zip

  package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts syntax
        shell: pwsh
        run: |
          $files = @("windows\AIGauge.ps1", "windows\install.ps1", "windows\uninstall.ps1", "windows\get-ai-gauge.ps1")
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            $full = (Resolve-Path $f).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$f : $_" }
              throw "PowerShell syntax error in $f"
            }
            Write-Host "Syntax OK: $f"
          }

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $v = if ($ref -match '^v(\d+\.\d+(\.\d+)?)') { $Matches[1] } else { "1.3.1" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Fetch Node.js (SHA-256 verified)
        shell: pwsh
        run: ./windows/installer/fetch-node.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build AI-Gauge-Setup.exe
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "windows\installer\AIGauge.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\AI-Gauge-Setup.exe")) { throw "dist\AI-Gauge-Setup.exe was not produced" }

      - name: Build portable ZIP (script installer, fallback)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage\windows -Force | Out-Null
          Copy-Item install.bat, AIGauge.bat, config.example.json, README.md, LICENSE -Destination stage\
          Copy-Item -Recurse core stage\core
          Copy-Item windows\AIGauge.ps1, windows\AIGauge.vbs, windows\AIGauge.bat, windows\get-ai-gauge.ps1, windows\install.ps1, windows\install.bat, windows\uninstall.ps1, windows\icon.ico -Destination stage\windows\
          Compress-Archive -Path stage\* -DestinationPath AI-Gauge-Windows-vh2c.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            dist/AI-Gauge-Setup.exe
            AI-Gauge-Windows-vh2c.zip

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Linux files
        run: |
          chmod +x linux/install.sh linux/quota-hub linux/quota-hub.py linux/ai-gauge
          zip -r AI-Gauge-Linux-vh2c.zip core linux assets/icon.png config.example.json LICENSE README.md

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            AI-Gauge-Linux-vh2c.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, package-windows, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          # The Windows artifact keeps its dist/ folder; flatten it so every file sits in release/
          if [ -f dist/AI-Gauge-Setup.exe ]; then mv dist/AI-Gauge-Setup.exe .; fi
          ls -la
          sha256sum AI-Gauge-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AI-Gauge-Setup.exe
            release/AI-Gauge-Windows-vh2c.zip
            release/AI-Gauge-macOS-vh2c.zip
            release/AI-Gauge-Linux-vh2c.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          # Draft: nothing becomes public (or visible to /releases/latest) until you publish it.
          # The API decides latest_version/download_url shown to users.
          draft: true
          prerelease: false
          generate_release_notes: true
